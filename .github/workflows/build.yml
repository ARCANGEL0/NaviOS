name: Mobile Release

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/navi-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/navi-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Prepare release asset
        id: release
        run: |
          VERSION_NAME="$(ruby -ryaml -e 'print YAML.load_file("mobile/pubspec.yaml").fetch("version").split("+", 2).first')"
          RELEASE_TAG="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          APK_NAME="Navi-${RELEASE_TAG}.apk"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.apk }}" --title "NAVI ${{ steps.release.outputs.tag }}" --generate-notes --target "$GITHUB_SHA"
